# The smallest program over llvm.clang-dev: parse a module interface and walk its AST.
[package]
name    = "clang-dev-smoke"
version = "0.1.0"

[targets.clang-dev-smoke]
kind = "bin"
main = "src/main.cpp"

[build]
ldflags = ["-Wl,--error-limit=0"]

[dependencies]
openkal-llvm-runtime = "0.15.2"
# The C library MC++'s compiler is built with (mcpp-safe's root names it): speak-agent's fork, whose
# macOS start records the arguments and the environment before any constructor runs (0.19.5) --
# openkal-llvm-runtime asks for ^0.19.2 by version, and a root's git declaration wins.
openkal-musl = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.9" }

[dependencies.llvm]
clang-dev = { path = "../.." }
