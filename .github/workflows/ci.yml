name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  # The libraries build with mcpp on openkal, and a program over them parses a module interface.
  build:
    name: build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Platform order of the MC++ plan: linux-x64 first; the others join as they are brought up.
        os: [ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Build the libraries
        run: mcpp build -j auto
      - name: Smoke
        working-directory: tools/smoke
        run: |
          set -euo pipefail
          mcpp build -j auto
          smoke=$(find target -type f -name clang-dev-smoke -path '*/bin/*' | head -1)
          "$smoke" | tee smoke.txt
          grep -q 'module=m .* errors=0' smoke.txt
      # clang itself over llvm.clang-driver (and so llvm.codegen-dev): the driver, cc1 and cc1as in
      # process, the link step spawned, for both back ends.
      - name: clang in process (llvm.clang-driver)
        working-directory: tools/driver-smoke
        run: |
          set -euo pipefail
          mcpp build -j auto
          clang=$(find target -type f -name driver-smoke -path '*/bin/*' | head -1)
          "$clang" --version
          printf 'export module m;\nexport int answer() { return 42; }\n' > m.cppm
          "$clang" -std=c++23 --precompile m.cppm -o m.pcm
          printf 'extern "C" int puts(const char*);\nint main() { puts("hello from in-process clang"); }\n' > hello.cpp
          "$clang" --target=aarch64-unknown-linux-gnu -c hello.cpp -o hello-arm64.o
          "$clang" --target=x86_64-unknown-linux-gnu -O2 --ld-path="$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/$LLVM_VERSION/bin/ld.lld" hello.cpp -o hello
          ./hello | grep -q 'hello from in-process clang'

  # The other platforms, as mcppls builds them: one Linux host cross-builds for openkal's Windows target
  # (x86_64-pc-cygwin without __CYGWIN__: a POSIX world over openkal, musl above it) and its macOS one,
  # and the executables run on the platforms themselves (the Windows one also under wine here).
  cross-build:
    name: cross-build from Linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-windows-gnu, exe: '.exe', format: 'PE32+ executable' }
          - { target: aarch64-macos,      exe: '',     format: 'Mach-O 64-bit arm64' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Build the libraries for ${{ matrix.target }}
        run: mcpp build -j auto --target ${{ matrix.target }}
      - name: The smoke program for ${{ matrix.target }}
        working-directory: tools/smoke
        run: |
          set -euo pipefail
          mcpp build -j auto --target ${{ matrix.target }}
          smoke=$(find target -type f -name "clang-dev-smoke${{ matrix.exe }}" -path '*/bin/*' | head -1)
          file "$smoke" | tee /dev/stderr | grep -q '${{ matrix.format }}'
          mkdir -p ../../cross && cp "$smoke" ../../cross/
      - name: Under wine
        if: matrix.target == 'x86_64-windows-gnu'
        run: |
          set -euo pipefail
          sudo apt-get install -y wine64 > /dev/null || sudo apt-get install -y wine > /dev/null
          WINEDEBUG=-all wine cross/clang-dev-smoke.exe | tee smoke.txt
          grep -q 'module=m .* errors=0' smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: cross
          retention-days: 7

  run-cross:
    name: run on ${{ matrix.os }} (${{ matrix.target }})
    needs: cross-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-windows-gnu, exe: '.exe' }
          - { os: macos-14,     target: aarch64-macos,      exe: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: cross
      - name: The smoke program parses a module interface
        run: |
          set -euo pipefail
          chmod +x "cross/clang-dev-smoke${{ matrix.exe }}" || true
          # arm64 macOS runs only signed code: an ad hoc signature, as whoever ships the program adds.
          if [ "${{ runner.os }}" = macOS ]; then codesign -s - "cross/clang-dev-smoke"; fi
          "cross/clang-dev-smoke${{ matrix.exe }}" | tee smoke.txt
          grep -q 'module=m .* errors=0' smoke.txt

  # llvm-generated/ is what upstream's CMake would produce from llvm/: regenerating it from the
  # sources here must change nothing.
  generated:
    name: generated files are current
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Regenerate
        run: |
          set -euo pipefail
          python3 tools/gen_config.py
          python3 tools/gen_tablegen.py
      - name: Nothing changed
        run: |
          git status --short llvm-generated
          git diff --exit-code --stat llvm-generated
