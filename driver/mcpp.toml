# llvm.clang-driver: the clang command line itself -- the driver (clang_main), cc1 and cc1as run in
# process, and the FrontendTool that dispatches cc1's actions -- over llvm.codegen-dev.
#
# upstream's clang/tools/driver/*.cpp, unmodified. A consumer provides main() and calls clang_main
# (clang's own main is generated by CMake from llvm-driver-template.cpp.in). Target registration is
# the consumer's too: cc1 calls InitializeAllTargets(), and llvm/Config/Targets.def is empty here.
[package]
namespace   = "llvm"
name        = "clang-driver"
version     = "23.1.0.4"
description = "The clang 23.1 driver, cc1 and cc1as in process (clang_main), built by mcpp on openkal"
license     = "Apache-2.0 WITH LLVM-exception"
authors     = ["speak-agent"]

[targets.clang-driver]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"

[dependencies.llvm]
codegen-dev = { path = "../codegen" }

[build]
sources = [
  "../llvm/clang/tools/driver/driver.cpp",
  "../llvm/clang/tools/driver/cc1_main.cpp",
  "../llvm/clang/tools/driver/cc1as_main.cpp",
  "../llvm/clang/tools/driver/cc1gen_reproducer_main.cpp",
  "../llvm/clang/lib/FrontendTool/*.cpp",
  "../llvm/clang/lib/ExtractAPI/*.cpp",
  "../llvm/clang/lib/ExtractAPI/Serialization/*.cpp",
  "../llvm/clang/lib/Frontend/Rewrite/*.cpp",
  "../llvm/clang/lib/InstallAPI/HeaderFile.cpp",   # the one InstallAPI unit ExtractAPI names
]
include_dirs = [
  "../llvm-generated/include",
  "../llvm/clang/include",
  "../llvm/clang/tools/driver",
]
defines  = ["_GNU_SOURCE", "__STDC_CONSTANT_MACROS", "__STDC_FORMAT_MACROS", "__STDC_LIMIT_MACROS", "NDEBUG"]
cxxflags = ["-O2", "-g0", "-w"]

# The platform's own LLVM configuration (tools/gen_config.py): host and default triples, native
# architecture, a shared library's extension; the C library is openkal-musl everywhere. LLVM's own
# include directory comes right after it, so a header written for the platform (Windows' Path.h) is
# the one found -- by these libraries and by every program that includes their headers.
[target.'cfg(os = "linux")'.build]
include_dirs = ["../llvm-generated/platform/linux", "../llvm/llvm/include"]

[target.'cfg(windows)'.build]
include_dirs = ["../llvm-generated/platform/windows", "../llvm/llvm/include"]
cxxflags     = ["-include", "openkal-host.h"]
cflags       = ["-include", "openkal-host.h"]

[target.'cfg(os = "macos")'.build]
include_dirs = ["../llvm-generated/platform/macos", "../llvm/llvm/include", "../port/include/darwin"]
cxxflags     = ["-include", "openkal-host.h"]
cflags       = ["-include", "openkal-host.h"]
